name: Next.js RSC compatibility
run-name: Next.js RSC compatibility (${{ inputs.compiler }}, ${{ inputs.scenario }})

on:
  workflow_dispatch:
    inputs:
      compiler:
        description: "Compiler: master, PR number (8904), commit SHA, npm version/tag, or package URL"
        required: true
        default: master
        type: string
      baseline:
        description: "Optional compiler expected to reproduce the nested .make failure (same formats)"
        required: false
        type: string
      scenario:
        description: "Scenario to test (all reports each case independently)"
        required: true
        default: all
        type: choice
        options:
          - all
          - nested
          - incremental
          - awaited
          - reexport

permissions:
  contents: read

jobs:
  nextjs-rsc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bun test scripts/compiler-package.test.js
      - run: bun run test:nextjs-rsc
        env:
          RESCRIPT_PACKAGE: ${{ inputs.compiler }}
          RESCRIPT_BASELINE: ${{ inputs.baseline }}
          RESCRIPT_SCENARIO: ${{ inputs.scenario }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextjs-rsc-results
          path: artifacts/nextjs-rsc
