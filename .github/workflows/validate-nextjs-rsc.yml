name: Validate Next.js RSC fixture

on:
  push:
    branches: [test/nextjs-rsc-nested-components]

permissions:
  contents: read

jobs:
  nextjs-rsc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bun run test:nextjs-rsc
        env:
          RESCRIPT_PACKAGE: https://pkg.pr.new/rescript-lang/rescript@ee81531f49bda16fecf77e2c0563ae6d9a5a31ec
          RESCRIPT_BASELINE: https://pkg.pr.new/rescript-lang/rescript@58f1bd223b455d60990dbce94b77720644f98bf9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextjs-rsc-results
          path: artifacts/nextjs-rsc
