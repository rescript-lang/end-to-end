name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      compiler:
        description: Optional ReScript version or pkg.pr.new URL for the Next.js/RSC test
        required: false
        type: string
      baseline:
        description: Optional compiler package expected to reproduce the nested JSX failure
        required: false
        type: string

jobs:
  main:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.compiler == '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - run: corepack enable
      - run: bun install
      - run: bun run test

  nextjs-rsc:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.compiler != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bun run test:nextjs-rsc
        env:
          RESCRIPT_PACKAGE: ${{ inputs.compiler }}
          RESCRIPT_BASELINE: ${{ inputs.baseline }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextjs-rsc-results
          path: artifacts/nextjs-rsc

  notify:
    runs-on: ubuntu-latest
    needs: main
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    steps:
      - uses: lacherogwu/failed-jobs-discord-notification-action@v1
        with:
          discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          needs_json: ${{ toJSON(needs) }}
